name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so the two
# "real CUDA kernel" tests (ndt_cuda_gpu_test, ndt_cuda_multigrid_gpu_test)
# report "skipped" in ci.yml. This runs them on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim) against the koide3/ndt_omp and
# tier4/ndt_omp references. A simulator cannot reproduce hardware-specific
# behavior or timing, so it complements real-GPU testing and does not replace it.

on:
  push:
    branches: [ verify-gpu-sim ]
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "data/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu-tests:
    name: GPU tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ git libpcl-dev libeigen3-dev

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The simulator needs a shared CUDA runtime, and CMakeLists.txt links
      # CUDA::cudart_static, so this job (and only this job) switches it with sed.
      # 90-virtual embeds PTX only, which the simulator runs.
      - name: Configure
        run: |
          sed -i 's/CUDA::cudart_static/CUDA::cudart/' CMakeLists.txt
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/local/cuda-13.0 \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DNDT_CUDA_BUILD_EXAMPLES=OFF \
            -DNDT_CUDA_BUILD_GPU_TESTS=ON

      - name: Build
        run: cmake --build build -j3 --target ndt_cuda_gpu_test ndt_cuda_multigrid_gpu_test

      # The tests exit with 77 (ctest "skipped") when no device is found, so
      # fail the step if either one was skipped instead of run.
      - name: Test
        run: |
          vgpu run ctest --test-dir build --output-on-failure --no-tests=error -R gpu_test 2>&1 | tee ctest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -qi "skipped" ctest.log; then echo "a GPU test was skipped"; exit 1; fi
